  if (!OV || !OV[i] || !OV[i].length || Q.get("ov") === "0") return glc;   // ?ov=0: the picture without overlays
  ovCtx.globalAlpha = 1; ovCtx.drawImage(glc, 0, 0);
  drawOverlays(ovCtx, OV[i], RW, RH);
  return ovCanvas;
};

window.__ready = true;
</script>
